function updateItemOptions(){const cat=document.getElementById('admItemCategory').value;const sel=document.getElementById('admItemName');if(!sel)return;let opts='';if(cat==='weapon'){['普通铁剑','精铁长剑','青云剑','玄铁重剑'].forEach(n=>opts+=`<option value="${n}">${n}</option>`)}else if(cat==='acc'){['狼牙护符','灵猴玉佩','护心铜镜','疾风铃','幽魂精魄'].forEach(n=>opts+=`<option value="${n}">${n}</option>`)}else if(cat==='consume'){['粗制灵草','解毒丹','回春散','聚气散','回春丹','聚气丹'].forEach(n=>opts+=`<option value="${n}">${n}</option>`)}else if(cat==='breakthrough'){['破障丹','凝神丹','天机丹'].forEach(n=>opts+=`<option value="${n}">${n}</option>`)}else if(cat==='gift'){GIFT_DB.forEach(g=>opts+=`<option value="${g.name}">${g.name}</option>`)}else if(cat==='ingredient'){Object.keys(INGREDIENT_DB).forEach(n=>opts+=`<option value="${n}">${n}</option>`)}else if(cat==='dish'){RECIPE_DB.forEach(r=>opts+=`<option value="${r.name}">${r.name}</option>`)}sel.innerHTML=opts}
function updateBookOptions(){const quality=document.getElementById('admBookQuality').value;const tierSel=document.getElementById('admBookTier');const maxT=SKILL_QUALITY[quality].maxTier;let opts='';for(let i=1;i<=Math.min(maxT,5);i++)opts+=`<option value="${i}">${i}阶</option>`;tierSel.innerHTML=opts}
function updatePositionOptions(){const sectName=document.getElementById('admNpcSect').value;const sel=document.getElementById('admNpcPos');if(!sel)return;let positions=['散修'];const sect=[...SECTS_TOP,...SECTS_MID,...SECTS_LOW].find(s=>s.name===sectName);if(sect)positions=sect.positions;sel.innerHTML=positions.map(p=>`<option value="${p}">${p}</option>`).join('')}

function applyAdmin(){const val=(id)=>parseInt(document.getElementById(id).value)||0;const nameRaw=document.getElementById('admName').value.trim(),daoRaw=document.getElementById('admDao').value.trim(),nickRaw=document.getElementById('admNick').value.trim();if(nameRaw){if(nameRaw.length<=2){player.name.sur=nameRaw;player.name.given=''}else{player.name.sur=nameRaw.slice(0,2);player.name.given=nameRaw.slice(2,6)}}player.name.dao=daoRaw;player.name.nickname=nickRaw;player.exp=Math.max(0,val('admExp'));player.realmIndex=Math.min(REALMS.length-1,Math.max(0,val('admRealm')));player.hp=Math.max(1,val('admHp'));player.maxHp=Math.max(1,val('admMaxHp'));player.mp=Math.max(0,val('admMp'));player.maxMp=Math.max(0,val('admMaxMp'));player.atk=Math.max(1,val('admAtk'));player.def=Math.max(0,val('admDef'));player.agility=Math.max(1,val('admAgility'));player.dodge=Math.max(0,val('admDodge'));player.crit=Math.max(0,val('admCrit'));player.critDmg=Math.max(100,val('admCritDmg'));player.cooking=Math.max(0,val('admCooking'));player.cultivateBonus=Math.max(0,val('admCult')/100);player.gold=Math.max(0,val('admGold'));player.day=Math.max(1,val('admDay'));player.shichenIndex=Math.min(11,Math.max(0,val('admShichen')));player.hp=Math.min(player.hp,player.maxHp);player.mp=Math.min(player.mp,player.maxMp);refreshUI();toast('修改已应用');renderAdminPanel()}
function adminGrant(type,amount){if(type==='exp')player.exp+=amount;else if(type==='gold')player.gold+=amount;refreshUI();toast('已发放');renderAdminPanel()}
function adminFull(){player.hp=player.maxHp;player.mp=player.maxMp;refreshUI();toast('已回满');renderAdminPanel()}
function adminUnlockAllSecrets(){['low','mid','high','top'].forEach(t=>REALMS_LIST[t].forEach(r=>r.unlocked=true));toast('已解锁全部秘境');renderAdminPanel()}
function adminAddItem2(){const cat=document.getElementById('admItemCategory').value;const name=document.getElementById('admItemName').value;const count=Math.max(1,parseInt(document.getElementById('admItemCount').value)||1);if(cat==='weapon'||cat==='acc'||cat==='consume'||cat==='breakthrough'){const base=ITEM_DB[name];if(!base){toast('物品不存在');return}for(let i=0;i<count;i++)player.bag.push({...base,id:genId(),sellPrice:Math.floor((base.price||20)*.5)})}else if(cat==='gift'){const g=GIFT_DB.find(x=>x.name===name);if(!g){toast('物品不存在');return}for(let i=0;i<count;i++)player.bag.push({type:'gift',name:g.name,desc:'赠礼',price:g.price,id:genId(),sellPrice:Math.floor(g.price*.5)})}else if(cat==='ingredient'){const price=INGREDIENT_DB[name];if(!price){toast('食材不存在');return}for(let i=0;i<count;i++)player.bag.push({type:'ingredient',name,desc:'烹饪食材。',id:genId(),sellPrice:Math.floor(price*.3)})}else if(cat==='dish'){const r=RECIPE_DB.find(x=>x.name===name);if(!r){toast('菜肴不存在');return}for(let i=0;i<count;i++)player.bag.push(dishToItem(r))}toast(`已添加 ${name}×${count}`);renderAdminPanel()}
function adminAddSkillBook(){const type=document.getElementById('admBookType').value;const quality=document.getElementById('admBookQuality').value;const tier=Math.max(1,parseInt(document.getElementById('admBookTier').value)||1);const count=Math.max(1,parseInt(document.getElementById('admBookCount').value)||1);for(let i=0;i<count;i++){const sk=type==='xinfa'?createXinfa(tier,quality):createJianfa(tier,quality);const itemName=`${sk.name}·秘（${SKILL_QUALITY[quality].name}）`;player.bag.push({id:genId(),type:'skillbook',skillId:sk.id,bookTier:tier,skillData:sk,name:itemName,desc:`修习或提升「${sk.name}」`,price:600*tier,sellPrice:300*tier})}toast(`已添加秘籍×${count}`);renderAdminPanel()}
function adminAddPetEgg(){const petType=document.getElementById('admPetType').value;const count=Math.max(1,parseInt(document.getElementById('admPetCount').value)||1);const gender=document.getElementById('admPetGender').value;const pet=PET_SPECIES[petType];const q=pet.quality;for(let i=0;i<count;i++){player.petEggs.push({id:genId(),type:'petEgg',petType,name:`${pet.name}蛋`,desc:`可孵化出${pet.name}。品质：${PET_QUALITY_INFO[q].name}`,icon:pet.icon,quality:q,gender,remainingHours:pet.hatchTime,readyToHatch:false,sellPrice:Math.floor(pet.hatchTime*2)})}toast(`已添加 ${pet.name}蛋×${count}`);renderAdminPanel()}
function adminMaxSkill(){const skillId=document.getElementById('admMaxSkill').value;const sk=player.skills.find(s=>s.id===skillId);if(!sk){toast('功法不存在');return}const q=SKILL_QUALITY[sk.quality];const maxTier=q.maxTier;const oldB=calcSkillBonus(sk);sk.tier=maxTier;sk.level=10;if(sk.type==='passive'){const newB=calcSkillBonus(sk);player.atk+=newB.atk-oldB.atk;player.def+=newB.def-oldB.def}log(`【天道】${sk.name}拉满（${sk.tier}阶10级）`,'good');toast('已拉满');refreshUI();renderAdminPanel()}
function adminSetPet(){const petType=document.getElementById('admSetPetType').value;const dao=document.getElementById('admSetPetDao').value.trim();const yaoRealm=parseInt(document.getElementById('admSetPetRealm').value)||0;const favor=parseInt(document.getElementById('admSetPetFavor').value)||100;const gender=document.getElementById('admSetPetGender').value;const favDish=document.getElementById('admSetPetFavDish').value;const favItem=document.getElementById('admSetPetFavItem').value;const pet=PET_SPECIES[petType];const q=pet.quality;const qMult=PET_QUALITY_INFO[q].mult;const yaoBase=pet.yaoBase||{hp:60,atk:8,def:4,agi:12,mp:30};const petObj={id:genId(),type:'pet',name:pet.name,icon:pet.icon,desc:pet.desc,stat:pet.stat,value:pet.value,quality:q,gender,dao:dao||`${pet.name}灵修`,yaoRealm,yaoExp:0,maxHp:Math.floor(yaoBase.hp*qMult),hp:Math.floor(yaoBase.hp*qMult),maxMp:Math.floor(yaoBase.mp*qMult),mp:Math.floor(yaoBase.mp*qMult),atk:Math.floor(yaoBase.atk*qMult),def:Math.floor(yaoBase.def*qMult),agility:yaoBase.agi,favor,favDish,favItem};if(pet.critDmg)petObj.critDmg=pet.critDmg;if(player.pet)player.bag.push(player.pet);player.pet=petObj;toast(`已设置灵兽：${pet.name}`);refreshUI();renderAdminPanel()}
function adminAddNpc(){let name=document.getElementById('admNpcName').value.trim();let dao=document.getElementById('admNpcDao').value.trim();const gender=document.getElementById('admNpcGender').value;const sect=document.getElementById('admNpcSect').value||'散修';const position=document.getElementById('admNpcPos').value||'散修';const isYao=document.getElementById('admNpcIsYao').value==='true';const buddhist=isBuddhist(sect);const favDish=document.getElementById('admNpcFavDish').value||pickRandom(RECIPE_DB).name;const favItem=document.getElementById('admNpcFavItem').value||pickRandom(GIFT_DB).name;if(!name){const surnames=['李','王','张','刘','陈','赵','周','吴','孙','杨','沈','白','云','萧','林','洛'];const names=['青云','逍遥','天行','无痕','清霜','墨白','流风','惊鸿','落月','星河','若虚','明远'];name=pickRandom(surnames)+pickRandom(names)}if(!dao){const daos=['剑客','真人','散人','上人','道人','仙子','居士','老祖','尊者','灵修'];dao=pickRandom(daos)+name.slice(-1)}const val=(id)=>parseInt(document.getElementById(id).value)||0;const npc={id:genId(),name,dao,gender:buddhist?'男':gender,sect,position,desc:`${sect}的${position}。`,favor:50,isYao,isBuddhist:buddhist,favDish,favItem,realmIndex:val('admNpcRealm'),atk:val('admNpcAtk'),def:val('admNpcDef'),maxHp:val('admNpcHp'),agility:val('admNpcAgi'),dodge:val('admNpcDodge'),crit:val('admNpcCrit'),critDmg:150,weapon:{name:'青锋剑',atk:15,desc:'随身佩剑。'},acc1:null,acc2:null,pet:null};player.relations.push(npc);log(`【天道】结识 ${name}（${dao}）。`,'good');toast(`已结识 ${name}`);renderAdminPanel()}

/* ========== 轮回 ========== */
function openReincarnate(){const html=`<div class="modal-title">主 动 入 轮 回</div><div class="confirm-text">你确定要放弃当前的一切，<em>重新入轮回</em>吗？<br><br>所有境界、物品、功法将<em>全部清空</em>，<br>且此操作<em>无法撤销</em>。</div><div class="confirm-buttons"><button class="btn-no" onclick="closeModal()">再 想 想</button><button class="btn-yes" onclick="doReincarnate()">入 轮 回</button></div>`;showModal(html)}
function doReincarnate(){const oldName=player?JSON.parse(JSON.stringify(player.name)):{sur:'',given:'',dao:'',nickname:''};player=defaultPlayer();player.name=oldName;grantNewbiePack();refreshUI();closeModal();log('【轮回】一切归零。','system');toast('已入轮回');autoSave()}

/* ========== 刷新 ========== */
function refreshGame(){if(player){try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}}location.reload()}

/* ========== 弹窗 ========== */
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('active')}
function closeModal(){if(combatState.active){toast('战斗中无法离开');return}document.getElementById('modalOverlay').classList.remove('active')}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

/* ========== 姓名 ========== */
function showNameModal(){localStorage.setItem(STORY_KEY,'1');document.getElementById('storyModal').style.display='none';document.getElementById('nameModal').classList.add('active');updateNameButtonState();setTimeout(()=>{const el=document.getElementById('nameSur');if(el)el.focus()},200)}
function updateNamePreview(){const sur=document.getElementById('nameSur').value.trim(),given=document.getElementById('nameGiven').value.trim(),dao=document.getElementById('nameDao').value.trim(),nick=document.getElementById('nameNick').value.trim();const full=sur+given;let txt='';if(full&&dao)txt=`${full}（${dao}）`;else if(full)txt=full;else if(dao)txt=dao;else txt='—';document.getElementById('namePreview').textContent=txt;document.getElementById('namePreviewNick').textContent=nick?`小名：${nick}`:'';updateNameButtonState()}
function updateNameButtonState(){const sur=document.getElementById('nameSur')?.value.trim()||'';const given=document.getElementById('nameGiven')?.value.trim()||'';const dao=document.getElementById('nameDao')?.value.trim()||'';const btn=document.getElementById('confirmNameBtn');if(!btn)return;btn.disabled=!(sur&&given&&dao)}
document.addEventListener('input',function(e){if(['nameSur','nameGiven','nameDao','nameNick'].includes(e.target.id))updateNamePreview();if(['rnSur','rnGiven','rnDao','rnNick'].includes(e.target.id)){const sur=document.getElementById('rnSur').value.trim(),given=document.getElementById('rnGiven').value.trim(),dao=document.getElementById('rnDao').value.trim();const full=sur+given;let txt='';if(full&&dao)txt=`${full}（${dao}）`;else if(full)txt=full;else if(dao)txt=dao;else txt='—';const pv=document.getElementById('rnPreview');if(pv)pv.textContent=txt}});
function confirmName(){const sur=document.getElementById('nameSur').value.trim(),given=document.getElementById('nameGiven').value.trim(),dao=document.getElementById('nameDao').value.trim(),nickname=document.getElementById('nameNick').value.trim();if(!sur||!given||!dao){toast('姓、名、道号都必须至少填写一个字');return}if(sur.length>2){toast('姓氏不能超过两个字');return}if(given.length>4){toast('名字不能超过四个字');return}if(dao.length>6){toast('道号不能超过六个字');return}if(nickname.length>4){toast('小名不能超过四个字');return}const nameData={sur,given,dao,nickname};localStorage.setItem(NAME_KEY,JSON.stringify(nameData));document.getElementById('nameModal').classList.remove('active');initGame(nameData)}

/* ========== 启动 ========== */
function startGame(){localStorage.setItem(STORY_KEY,'1');showNameModal()}
function initGame(nameData){document.getElementById('game').style.display='block';initSaves();const autoRaw=localStorage.getItem(AUTO_KEY);let loaded=false;if(autoRaw){try{const data=JSON.parse(autoRaw);const def=defaultPlayer();for(const k in def)if(data[k]===undefined)data[k]=def[k];if(typeof data.shichenIndex!=='number'||data.shichenIndex<0||data.shichenIndex>11)data.shichenIndex=getRealShichenIndex();if(!data.name)data.name={sur:'',given:'',dao:'',nickname:''};if(data.name.dao===undefined)data.name.dao='';if(data.name.nickname===undefined)data.name.nickname='';if(!Array.isArray(data.skills))data.skills=[];if(!Array.isArray(data.relations))data.relations=[];if(!Array.isArray(data.petEggs))data.petEggs=[];if(typeof data.cooking!=='number')data.cooking=0;player=data;loaded=true}catch(e){}}if(!loaded){player=defaultPlayer();if(nameData)player.name=nameData;else{const savedName=localStorage.getItem(NAME_KEY);if(savedName){try{player.name=JSON.parse(savedName)}catch{}}if(!player.name.dao)player.name.dao='';if(!player.name.nickname)player.name.nickname=''}grantNewbiePack()}else if(nameData){if(!player.name.sur&&!player.name.given&&!player.name.dao)player.name=nameData}refreshUI();if(loaded)log(`【系统】读取存档成功，第 ${player.day} 天继续修行。`,'system');else log(`【修仙世界】${getDisplayName()}，第 ${player.day} 天，一切从零开始。`,'system');autoSave()}

/* ========== 持久化 ========== */
window.addEventListener('beforeunload',function(){if(!player)return;try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}});
setInterval(function(){if(!player)return;try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}},60000);

/* ========== 页面载入 ========== */
window.addEventListener('DOMContentLoaded',function(){const storySeen=localStorage.getItem(STORY_KEY);const autoRaw=localStorage.getItem(AUTO_KEY);const savedName=localStorage.getItem(NAME_KEY);if(storySeen){document.getElementById('storyModal').style.display='none';if(autoRaw||savedName)initGame();else{document.getElementById('nameModal').classList.add('active');updateNameButtonState()}}else{document.getElementById('storyModal').style.display='flex'}});

function upgradeSkillLevel(skillId){
  const sk=player.skills.find(s=>s.id===skillId);if(!sk)return;
  if(sk.level>=10){toast('已满');return}
  const cost=200*sk.level*(1+(sk.tier-1)*.5);
  if(player.gold<cost){toast('灵石不足');return}
  player.gold-=cost;const oldB=calcSkillBonus(sk);sk.level++;
  if(sk.type==='passive'){const newB=calcSkillBonus(sk);player.atk+=newB.atk-oldB.atk;player.def+=newB.def-oldB.def}
  log(`【功法】「${sk.name}」升至 ${sk.tier}阶${sk.level}级。`,'good');
  toast(`${sk.name} ${sk.level} 级`);refreshUI();openSkills();
}

function initSaves(){try{const raw=localStorage.getItem(STORAGE_KEY);saveSlots=raw?JSON.parse(raw):new Array(MANUAL_SLOTS).fill(null)}catch{saveSlots=new Array(MANUAL_SLOTS).fill(null)}if(!Array.isArray(saveSlots)||saveSlots.length<MANUAL_SLOTS){const t=new Array(MANUAL_SLOTS).fill(null);if(Array.isArray(saveSlots))for(let i=0;i<Math.min(saveSlots.length,MANUAL_SLOTS);i++)t[i]=saveSlots[i];saveSlots=t}}
function saveToSlot(slotIndex){if(!player)return;const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');if(slotIndex===AUTO_SLOT)localStorage.setItem(AUTO_KEY,JSON.stringify(data));else{saveSlots[slotIndex-1]=data;localStorage.setItem(STORAGE_KEY,JSON.stringify(saveSlots))}toast('存档成功')}
function loadFromSlot(slotIndex){
  let data;
  if(slotIndex===AUTO_SLOT){const raw=localStorage.getItem(AUTO_KEY);if(!raw){toast('无自动存档');return}data=JSON.parse(raw)}
  else{if(!saveSlots[slotIndex-1]){toast('空存档位');return}data=saveSlots[slotIndex-1]}
  const def=defaultPlayer();
  for(const k in def)if(data[k]===undefined)data[k]=def[k];
  if(!data.name)data.name={sur:'',given:'',dao:'',nickname:''};
  if(data.name.dao===undefined)data.name.dao='';if(data.name.nickname===undefined)data.name.nickname='';
  if(!Array.isArray(data.skills))data.skills=[];if(!Array.isArray(data.relations))data.relations=[];if(!Array.isArray(data.petEggs))data.petEggs=[];
  if(!data.spiritRoot)data.spiritRoot=rollSpiritRoot(0);
  if(!data.physique)data.physique='none';
  if(typeof data.year!=='number')data.year=1;
  if(typeof data.month!=='number')data.month=1;
  if(typeof data.pillToxicity!=='number')data.pillToxicity=0;
  if(!Array.isArray(data.shopXinfaStock)||data.shopXinfaStock.length===0){const s=initShopSkillStock();data.shopXinfaStock=s.xinfaStock;data.shopJianfaStock=s.jianfaStock}
  if(!data.pillDB||!data.pillDB.common)data.pillDB=genAllPills();
  player=data;refreshUI();closeModal();toast('读档成功');
}
function deleteSlot(slotIndex){if(slotIndex===AUTO_SLOT)localStorage.removeItem(AUTO_KEY);else{saveSlots[slotIndex-1]=null;localStorage.setItem(STORAGE_KEY,JSON.stringify(saveSlots))}openSavePanel()}
function autoSave(){saveToSlot(AUTO_SLOT)}
function openSavePanel(){
  let html=`<div class="modal-title">存 档 · 读 档</div>`;
  const autoRaw=localStorage.getItem(AUTO_KEY);let autoData=null;try{autoData=autoRaw?JSON.parse(autoRaw):null}catch{}
  html+=`<div class="save-slot auto"><div class="slot-info"><div class="slot-title">📁 自动存档</div><div class="slot-detail">${autoData?`${autoData._saveTime||'—'} · ${autoData.year||1}年${autoData.month||1}月${autoData.day||1}日`:'暂无'}</div></div><div class="slot-actions">${autoData?`<button onclick="loadFromSlot(0)">读 档</button>`:''}${autoData?`<button onclick="deleteSlot(0);openSavePanel();">删 除</button>`:''}</div></div>`;
  for(let i=0;i<MANUAL_SLOTS;i++){
    const d=saveSlots[i];
    html+=`<div class="save-slot"><div class="slot-info"><div class="slot-title">存档位 ${i+1}</div><div class="slot-detail">${d?`${d._saveTime||'—'} · ${d.year||1}年${d.month||1}月${d.day||1}日`:'空'}</div></div><div class="slot-actions"><button onclick="saveToSlot(${i+1});openSavePanel();">存 档</button>${d?`<button onclick="loadFromSlot(${i+1})">读 档</button>`:''}${d?`<button onclick="deleteSlot(${i+1});openSavePanel();">删 除</button>`:''}</div></div>`;
  }
  html+=`<button class="modal-close" onclick="closeModal()">关 闭</button>`;
  showModal(html);
}

    <div class="admin-row"><label>品阶</label><select id="admBookQuality" onchange="updateBookOptions()"><option value="common">凡品</option><option value="mid">中品</option><option value="high">上品</option><option value="supreme">极品</option></select></div>
    <div class="admin-row"><label>阶数</label><select id="admBookTier"><option value="1">1阶</option><option value="2">2阶</option><option value="3">3阶</option></select></div>
    <div class="admin-row"><label>数量</label><input type="number" id="admBookCount" value="1" min="1"></div>
    <button class="admin-submit" onclick="adminAddSkillBook()">添 加 秘 籍</button>
  </div>

  <button class="modal-close" onclick="closeModal()">关 闭</button>`;
  showModal(html);
  updateItemOptions();updatePillOptions();
}
const INGREDIENT_DB_LOCAL={大米:1,青菜:2,猪肉:3,鸡肉:3,鱼:3,牛肉:4,鸭肉:5,虾仁:5,蟹肉:6,豆腐:2,灵果:8,灵兽肉:12,灵芝:15,人参:12,红枣:2,莲子:2,银耳:2,枸杞:2,菊花:1,茶叶:2,灵茶:6,桂花:3,蜂蜜:4,雪莲:20,灵泉水:4};
function updateItemOptions(){
  const cat=document.getElementById('admItemCategory').value;const sel=document.getElementById('admItemName');if(!sel)return;let opts='';
  if(cat==='weapon')['普通铁剑','精铁长剑','青云剑','玄铁重剑'].forEach(n=>opts+=`<option value="${n}">${n}</option>`);
  else if(cat==='buddhist')['禅杖','念珠','降魔杵','金钵','菩提念珠'].forEach(n=>opts+=`<option value="${n}">${n}</option>`);
  else if(cat==='acc')['狼牙护符','灵猴玉佩','护心铜镜','疾风铃','幽魂精魄'].forEach(n=>opts+=`<option value="${n}">${n}</option>`);
  else if(cat==='herb')HERB_LIST.forEach(n=>opts+=`<option value="${n}">${n}</option>`);
  else if(cat==='gift')GIFT_DB.forEach(g=>opts+=`<option value="${g.name}">${g.name}</option>`);
  else if(cat==='ingredient')Object.keys(INGREDIENT_DB_LOCAL).forEach(n=>opts+=`<option value="${n}">${n}</option>`);
  else if(cat==='dish')RECIPE_DB.forEach(r=>opts+=`<option value="${r.name}">${r.name}</option>`);
  sel.innerHTML=opts;
}
function updateBookOptions(){
  const q=document.getElementById('admBookQuality').value;
  const t=document.getElementById('admBookTier');const maxT=Math.min(SKILL_QUALITY[q].maxTier,5);
  let opts='';for(let i=1;i<=maxT;i++)opts+=`<option value="${i}">${i}阶</option>`;t.innerHTML=opts;
}
function updatePillOptions(){
  const q=document.getElementById('admPillQuality').value;const sel=document.getElementById('admPillName');if(!sel)return;
  const pool=player.pillDB[q]||[];sel.innerHTML=pool.map(p=>`<option value="${p.id}">${p.name} - ${p.desc}</option>`).join('');
}
function applyAdmin(){
  const val=(id)=>parseInt(document.getElementById(id).value)||0;
  const nameRaw=document.getElementById('admName').value.trim(),daoRaw=document.getElementById('admDao').value.trim(),nickRaw=document.getElementById('admNick').value.trim();
  if(nameRaw){if(nameRaw.length<=2){player.name.sur=nameRaw;player.name.given=''}else{player.name.sur=nameRaw.slice(0,2);player.name.given=nameRaw.slice(2,6)}}
  player.name.dao=daoRaw;player.name.nickname=nickRaw;
  const rootV=document.getElementById('admRoot').value;
  if(rootV==='chaos')player.spiritRoot={type:'chaos'};
  else if(rootV==='mutated')player.spiritRoot={type:'mutated',subType:player.spiritRoot.subType||pickRandom(SPIRIT_SUBTYPE.mutated)};
  else if(rootV==='heavenly')player.spiritRoot={type:'heavenly',subType:player.spiritRoot.subType||pickRandom(SPIRIT_SUBTYPE.heavenly)};
  else player.spiritRoot={type:rootV};
  player.physique=document.getElementById('admPhys').value;
  player.appearance=Math.max(0,Math.min(100,val('admApp')));
  player.talent=Math.max(0,Math.min(100,val('admTalent')));
  player.exp=Math.max(0,val('admExp'));
  player.realmIndex=Math.min(REALMS.length-1,Math.max(0,val('admRealm')));
  player.hp=Math.max(1,val('admHp'));player.maxHp=Math.max(1,val('admMaxHp'));
  player.mp=Math.max(0,val('admMp'));player.maxMp=Math.max(0,val('admMaxMp'));
  player.atk=Math.max(1,val('admAtk'));player.def=Math.max(0,val('admDef'));
  player.agility=Math.max(1,val('admAgility'));player.dodge=Math.max(0,val('admDodge'));
  player.crit=Math.max(0,val('admCrit'));player.critDmg=Math.max(100,val('admCritDmg'));
  player.pillToxicity=Math.max(0,Math.min(99,val('admTox')));
  player.cooking=Math.max(0,val('admCooking'));player.alchemy=Math.max(0,val('admAlchemy'));
  player.gold=Math.max(0,val('admGold'));
  player.year=Math.max(1,val('admYear'));player.month=Math.min(12,Math.max(1,val('admMonth')));player.day=Math.min(30,Math.max(1,val('admDay')));
  player.shichenIndex=Math.min(11,Math.max(0,val('admShichen')));
  player.hp=Math.min(player.hp,player.maxHp);player.mp=Math.min(player.mp,player.maxMp);
  refreshUI();toast('修改已应用');renderAdminPanel();
}
function adminGrant(type,amount){if(type==='exp')player.exp+=amount;else if(type==='gold')player.gold+=amount;refreshUI();toast('已发放');renderAdminPanel()}
function adminFull(){player.hp=player.maxHp;player.mp=player.maxMp;refreshUI();toast('已回满');renderAdminPanel()}
function adminClearTox(){player.pillToxicity=0;refreshUI();toast('丹毒已清空');renderAdminPanel()}
function adminUnlockAllSecrets(){['low','mid','high','top'].forEach(t=>REALMS_LIST[t].forEach(r=>r.unlocked=true));toast('已解锁全部秘境');renderAdminPanel()}
function adminRefreshPills(){player.pillDB=genAllPills();toast('丹药已重置');renderAdminPanel()}
function adminAddAllHerbs(){HERB_LIST.forEach(h=>{for(let i=0;i<10;i++)player.bag.push({id:genId(),type:'herb',name:h,desc:'炼丹灵草。',sellPrice:Math.floor(HERB_DB[h]*.3),price:HERB_DB[h]})});toast('已添加全部40种灵草各10个');renderAdminPanel()}
function adminAddItem2(){
  const cat=document.getElementById('admItemCategory').value;const name=document.getElementById('admItemName').value;const count=Math.max(1,parseInt(document.getElementById('admItemCount').value)||1);
  if(cat==='weapon'||cat==='buddhist'||cat==='acc'){const base=ITEM_DB[name];if(!base){toast('物品不存在');return}for(let i=0;i<count;i++)player.bag.push({...base,id:genId(),sellPrice:Math.floor((base.price||20)*.5)})}
  else if(cat==='herb'){const price=HERB_DB[name];for(let i=0;i<count;i++)player.bag.push({id:genId(),type:'herb',name,desc:'炼丹灵草。',sellPrice:Math.floor(price*.3),price})}
  else if(cat==='gift'){const g=GIFT_DB.find(x=>x.name===name);if(!g){toast('物品不存在');return}for(let i=0;i<count;i++)player.bag.push({type:'gift',name:g.name,desc:'赠礼',price:g.price,id:genId(),sellPrice:Math.floor(g.price*.5)})}
  else if(cat==='ingredient'){const price=INGREDIENT_DB_LOCAL[name];for(let i=0;i<count;i++)player.bag.push({type:'ingredient',name,desc:'烹饪食材。',id:genId(),sellPrice:Math.floor(price*.3)})}
  else if(cat==='dish'){const r=RECIPE_DB.find(x=>x.name===name);for(let i=0;i<count;i++)player.bag.push(dishToItem(r))}
  toast(`已添加 ${name}×${count}`);renderAdminPanel();
}
function adminAddPills(){
  const q=document.getElementById('admPillQuality').value;const pid=document.getElementById('admPillName').value;const count=Math.max(1,parseInt(document.getElementById('admPillCount').value)||1);
  const pill=player.pillDB[q].find(p=>p.id===pid);if(!pill){toast('丹药不存在');return}
  for(let i=0;i<count;i++)player.bag.push({id:genId(),type:'consume',name:pill.name,desc:pill.desc,effect:{...pill.effect},heal:pill.effect.heal||0,mana:pill.effect.mana||0,exp:pill.effect.exp||0,bonus:pill.effect.bonus||0,maxHp:pill.effect.maxHp||0,maxMp:pill.effect.maxMp||0,atk:pill.effect.atk||0,def:pill.effect.def||0,dodge:pill.effect.dodge||0,sellPrice:pill.sellPrice,price:pill.buyPrice,tox:pill.tox});
  toast(`已添加 ${pill.name}×${count}`);renderAdminPanel();
}
function adminAddSkillBook(){
  const type=document.getElementById('admBookType').value;const q=document.getElementById('admBookQuality').value;const tier=Math.max(1,parseInt(document.getElementById('admBookTier').value)||1);const count=Math.max(1,parseInt(document.getElementById('admBookCount').value)||1);
  for(let i=0;i<count;i++){
    const sk=type==='xinfa'?createXinfa(tier,q):createJianfa(tier,q);
    player.bag.push({id:genId(),type:'skillbook',skillId:sk.id,bookTier:tier,skillData:sk,name:`${sk.name}·秘`,desc:`修习或提升「${sk.name}」`,price:600*tier,sellPrice:300*tier});
  }
  toast(`已添加秘籍×${count}`);renderAdminPanel();
}

/* ========== 轮回 ========== */
function openReincarnate(){
  const html=`<div class="modal-title">主 动 入 轮 回</div><div class="confirm-text">你确定要放弃当前的一切，<em>重新入轮回</em>吗？<br><br>所有境界、物品、功法将<em>全部清空</em>，<br>且此操作<em>无法撤销</em>。</div><div class="confirm-buttons"><button class="btn-no" onclick="closeModal()">再 想 想</button><button class="btn-yes" onclick="doReincarnate()">入 轮 回</button></div>`;
  showModal(html);
}
function doReincarnate(){
  const oldName=player?JSON.parse(JSON.stringify(player.name)):{sur:'',given:'',dao:'',nickname:''};
  player=defaultPlayer();player.name=oldName;grantNewbiePack();
  refreshUI();closeModal();log('【轮回】一切归零。','system');toast('已入轮回');autoSave();
}

/* ========== 刷新 ========== */
function refreshGame(){if(player){try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}}location.reload()}

/* ========== 弹窗 ========== */
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('active')}
function closeModal(){if(combatState.active){toast('战斗中无法离开');return}document.getElementById('modalOverlay').classList.remove('active')}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

/* ========== 姓名 ========== */
function showNameModal(){
  localStorage.setItem(STORY_KEY,'1');
  document.getElementById('storyModal').style.display='none';
  document.getElementById('nameModal').classList.add('active');
  updateNameButtonState();
  setTimeout(()=>{const el=document.getElementById('nameSur');if(el)el.focus()},200);
}
function updateNamePreview(){
  const sur=document.getElementById('nameSur').value.trim(),given=document.getElementById('nameGiven').value.trim(),dao=document.getElementById('nameDao').value.trim(),nick=document.getElementById('nameNick').value.trim();
  const full=sur+given;let txt='';
  if(full&&dao)txt=`${full}（${dao}）`;else if(full)txt=full;else if(dao)txt=dao;else txt='—';
  document.getElementById('namePreview').textContent=txt;
  document.getElementById('namePreviewNick').textContent=nick?`小名：${nick}`:'';
  updateNameButtonState();
}
function updateNameButtonState(){
  const sur=document.getElementById('nameSur')?.value.trim()||'';
  const given=document.getElementById('nameGiven')?.value.trim()||'';
  const dao=document.getElementById('nameDao')?.value.trim()||'';
  const btn=document.getElementById('confirmNameBtn');
  if(btn)btn.disabled=!(sur&&given&&dao);
}
document.addEventListener('input',function(e){if(['nameSur','nameGiven','nameDao','nameNick'].includes(e.target.id))updateNamePreview()});
function confirmName(){
  const sur=document.getElementById('nameSur').value.trim(),given=document.getElementById('nameGiven').value.trim(),dao=document.getElementById('nameDao').value.trim(),nickname=document.getElementById('nameNick').value.trim();
  if(!sur||!given||!dao){toast('姓、名、道号必须填写');return}
  if(sur.length>2){toast('姓≤2字');return}
  if(given.length>4){toast('名≤4字');return}
  if(dao.length>6){toast('道号≤6字');return}
  if(nickname.length>4){toast('小名≤4字');return}
  const nameData={sur,given,dao,nickname};
  localStorage.setItem(NAME_KEY,JSON.stringify(nameData));
  document.getElementById('nameModal').classList.remove('active');
  initGame(nameData);
}

/* ========== 启动 ========== */
function startGame(){localStorage.setItem(STORY_KEY,'1');showNameModal()}
function initGame(nameData){
  document.getElementById('game').style.display='block';
  initSaves();
  const autoRaw=localStorage.getItem(AUTO_KEY);
  let loaded=false;
  if(autoRaw){
    try{
      const data=JSON.parse(autoRaw);
      const def=defaultPlayer();
      for(const k in def)if(data[k]===undefined)data[k]=def[k];
      if(typeof data.shichenIndex!=='number'||data.shichenIndex<0||data.shichenIndex>11)data.shichenIndex=getRealShichenIndex();
      if(!data.name)data.name={sur:'',given:'',dao:'',nickname:''};
      if(data.name.dao===undefined)data.name.dao='';if(data.name.nickname===undefined)data.name.nickname='';
      if(!Array.isArray(data.skills))data.skills=[];if(!Array.isArray(data.relations))data.relations=[];if(!Array.isArray(data.petEggs))data.petEggs=[];
      if(!data.spiritRoot)data.spiritRoot=rollSpiritRoot(0);
      if(!data.physique)data.physique='none';
      if(typeof data.year!=='number')data.year=1;if(typeof data.month!=='number')data.month=1;
      if(typeof data.pillToxicity!=='number')data.pillToxicity=0;
      if(!Array.isArray(data.shopXinfaStock)||data.shopXinfaStock.length===0){const s=initShopSkillStock();data.shopXinfaStock=s.xinfaStock;data.shopJianfaStock=s.jianfaStock}
      if(!data.pillDB||!data.pillDB.common)data.pillDB=genAllPills();
      player=data;loaded=true;
    }catch(e){}
  }
  if(!loaded){
    player=defaultPlayer();
    if(nameData)player.name=nameData;
    else{const savedName=localStorage.getItem(NAME_KEY);if(savedName){try{player.name=JSON.parse(savedName)}catch{}}if(!player.name.dao)player.name.dao='';if(!player.name.nickname)player.name.nickname=''}
    grantNewbiePack();
  }else if(nameData){
    if(!player.name.sur&&!player.name.given&&!player.name.dao)player.name=nameData;
  }
  refreshUI();
  if(loaded)log(`【系统】读取存档成功，${dateStr()}继续修行。`,'system');
  else{
    const rd=getRootDisplay();
    log(`【修仙世界】${getDisplayName()}，灵根【${rd.name}】，一切从零开始。`,'system');
    log('【提示】每月25号黑市开放拍卖。丹毒满100会毒发身亡！','system');
  }
  autoSave();
}

/* ========== 持久化 ========== */
window.addEventListener('beforeunload',function(){if(!player)return;try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}});
setInterval(function(){if(!player)return;try{const data=JSON.parse(JSON.stringify(player));data._saveTime=new Date().toLocaleString('zh-CN');localStorage.setItem(AUTO_KEY,JSON.stringify(data))}catch{}},60000);

window.addEventListener('DOMContentLoaded',function(){
  const storySeen=localStorage.getItem(STORY_KEY);
  const autoRaw=localStorage.getItem(AUTO_KEY);
  const savedName=localStorage.getItem(NAME_KEY);
  if(storySeen){
    document.getElementById('storyModal').style.display='none';
    if(autoRaw||savedName)initGame();
    else{document.getElementById('nameModal').classList.add('active');updateNameButtonState()}
  }else document.getElementById('storyModal').style.display='flex';
});
</script>
